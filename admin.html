<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAScore Admin Portal</title>
  <link rel="icon" type="image/png" href="images/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }, colors: { brand: { 50:'#f5f3ff', 500:'#8b5cf6', 600:'#7c3aed', 700:'#6d28d9', 900:'#4c1d95' } } } } };
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
</head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-800 dark:bg-gray-950 dark:text-gray-100">
  <main id="loginScreen" class="min-h-screen grid place-items-center p-4">
    <section class="w-full max-w-md rounded-3xl border border-gray-100 bg-white p-6 shadow-xl dark:border-gray-800 dark:bg-gray-900 sm:p-8">
      <div class="mb-7 text-center"><img src="images/icon.png" alt="NAScore" class="mx-auto mb-3 h-16 w-16 rounded-2xl object-cover"><h1 class="text-2xl font-black">Admin Login</h1><p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Sign in to manage the store catalogue.</p></div>
      <form id="loginForm" class="space-y-3">
        <input id="loginUsername" required type="email" autocomplete="email" placeholder="Admin email" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-3 text-sm outline-none focus:ring-2 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800">
        <div class="relative"><input id="loginPassword" required type="password" autocomplete="current-password" placeholder="Password" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-3 pr-11 text-sm outline-none focus:ring-2 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800"><button type="button" onclick="togglePassword()" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-gray-400" aria-label="Show or hide password"><i id="passwordIcon" class="fa-solid fa-eye"></i></button></div>
        <p id="loginError" class="hidden text-xs font-semibold text-red-600"></p>
        <button class="w-full rounded-xl bg-brand-600 py-3 text-sm font-extrabold text-white transition hover:bg-brand-700">Login</button>
      </form>
      <a href="index.html" class="mt-5 block text-center text-xs font-bold text-brand-600 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Back to store</a>
    </section>
  </main>

  <div id="adminPortal" class="hidden">
    <header class="sticky top-0 z-30 border-b border-gray-100 bg-white/95 backdrop-blur dark:border-gray-800 dark:bg-gray-900/95">
      <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
        <a href="index.html" class="flex items-center gap-2"><img src="images/icon.png" alt="NAScore" class="h-10 w-10 rounded-xl object-cover"><div><p class="font-black leading-tight">NAScore</p><p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Admin Portal</p></div></a>
        <div class="flex items-center gap-2"><button onclick="openProductForm()" class="rounded-xl bg-brand-600 px-3 py-2.5 text-xs font-extrabold text-white hover:bg-brand-700 sm:px-4"><i class="fa-solid fa-plus mr-1"></i><span class="hidden sm:inline">Add Product</span><span class="sm:hidden">Add</span></button><button onclick="logout()" class="rounded-xl border border-gray-200 px-3 py-2.5 text-xs font-bold text-gray-600 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800"><i class="fa-solid fa-right-from-bracket sm:mr-1"></i><span class="hidden sm:inline">Logout</span></button></div>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-7 sm:px-6 lg:px-8">
      <div class="mb-6 flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between"><div><h1 class="text-2xl font-black text-gray-900 dark:text-white sm:text-3xl">Manage Products</h1><p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Add, edit, delete, and update stock from one place.</p></div><p id="productCount" class="text-xs font-bold text-gray-500 dark:text-gray-400"></p></div>
      <div id="emptyState" class="hidden rounded-2xl border border-dashed border-gray-300 p-10 text-center dark:border-gray-700"><i class="fa-solid fa-box-open mb-3 text-3xl text-gray-400"></i><p class="font-bold">No products found</p><button onclick="openProductForm()" class="mt-3 text-sm font-bold text-brand-600">Add your first product</button></div>
      <section id="productGrid" class="grid grid-cols-2 gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-3 xl:grid-cols-4"></section>
    </main>
  </div>

  <div id="productModal" class="pointer-events-none fixed inset-0 z-50 flex items-end justify-center bg-black/70 p-0 opacity-0 transition sm:items-center sm:p-4">
    <div class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl dark:bg-gray-900 sm:rounded-3xl sm:p-6" id="productModalCard">
      <div class="mb-5 flex items-center justify-between"><div><h2 id="formTitle" class="text-xl font-black">Add Product</h2><p class="text-xs text-gray-500 dark:text-gray-400">Fill product details and save.</p></div><button onclick="closeProductForm()" class="rounded-full bg-gray-100 p-2 text-gray-500 dark:bg-gray-800"><i class="fa-solid fa-xmark"></i></button></div>
      <form id="productForm" class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <input id="productId" type="hidden">
        <input id="productName" required placeholder="Product name" class="field">
        <input id="productPrice" required min="0" type="number" placeholder="Price (Rs.)" class="field">
        <input id="productOriginalPrice" min="0" type="number" placeholder="Cut/original price (optional)" class="field">
        <label class="field flex items-center gap-2 font-semibold"><input id="productInStock" type="checkbox" class="h-4 w-4 accent-violet-600" checked> In stock</label>
        <label class="field flex items-center gap-2 font-semibold"><input id="productHasSizes" type="checkbox" class="h-4 w-4 accent-violet-600" checked> Product has sizes</label>
        <select id="productCategory" class="field"><option>Traditional</option><option>Western</option><option>Womens</option><option>Footwear</option><option>Accessories</option></select>
        <input id="productBadge" placeholder="Badge e.g. New (optional)" class="field">
        <div class="sm:col-span-2"><label class="mb-1 block text-xs font-bold">Product image</label><input id="productImage" accept="image/png,image/jpeg,image/webp" type="file" class="block w-full text-xs file:mr-3 file:rounded-lg file:border-0 file:bg-brand-50 file:px-3 file:py-2 file:font-bold file:text-brand-700"><p class="mt-1 text-[11px] text-gray-500">JPG, PNG or WebP · maximum 700 KB.</p><img id="imagePreview" class="mt-2 hidden h-24 w-24 rounded-xl border object-cover" alt="Preview"></div>
        <textarea id="productDescription" required rows="4" placeholder="Product description" class="field sm:col-span-2"></textarea>
        <div class="sm:col-span-2 flex justify-end gap-2"><button type="button" onclick="closeProductForm()" class="rounded-xl px-4 py-2.5 text-xs font-bold text-gray-600 dark:text-gray-300">Cancel</button><button class="rounded-xl bg-brand-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-brand-700"><i class="fa-solid fa-floppy-disk mr-1"></i><span id="saveLabel">Add Product</span></button></div>
      </form>
    </div>
  </div>
  <style>.field{width:100%;border-radius:.75rem;border:1px solid #e5e7eb;background:#fff;padding:.65rem .75rem;font-size:.875rem;outline:none}.field:focus{box-shadow:0 0 0 2px #8b5cf6}@media(prefers-color-scheme:dark){.field{border-color:#374151;background:#1f2937;color:#fff}}</style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
  <style>
#cursorCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999999;
}
</style>

<canvas id="cursorCanvas"></canvas>

<script>

if(window.matchMedia("(pointer:fine)").matches){

const canvas=document.getElementById("cursorCanvas");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const particles=[];

class Particle{

constructor(x,y){

this.x=x;
this.y=y;

this.dx=(Math.random()-0.5)*4;
this.dy=(Math.random()-0.5)*4;

this.life=60;

this.size=Math.random()*5+2;

this.color=[
"#ffffff",
"#00e5ff",
"#7b61ff",
"#70ffcf",
"#8cf6ff"
][Math.floor(Math.random()*5)];

}

update(){

this.x+=this.dx;
this.y+=this.dy;

this.dy*=0.98;
this.dx*=0.98;

this.life--;

}

draw(){

ctx.globalAlpha=this.life/60;

ctx.beginPath();
ctx.fillStyle=this.color;
ctx.shadowBlur=20;
ctx.shadowColor=this.color;

ctx.arc(this.x,this.y,this.size,0,Math.PI*2);

ctx.fill();

}

}

window.addEventListener("mousemove",(e)=>{

for(let i=0;i<4;i++)
particles.push(new Particle(e.clientX,e.clientY));

});

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=particles.length-1;i>=0;i--){

particles[i].update();
particles[i].draw();

if(particles[i].life<=0)
particles.splice(i,1);

}

requestAnimationFrame(animate);

}

animate();

}

// Mobile Touch Effect

if(window.matchMedia("(pointer:coarse)").matches){

document.addEventListener("touchmove",function(e){

const touch=e.touches[0];

const glow=document.createElement("div");

glow.style.position="fixed";
glow.style.left=(touch.clientX-15)+"px";
glow.style.top=(touch.clientY-15)+"px";

glow.style.width="30px";
glow.style.height="30px";

glow.style.borderRadius="50%";

glow.style.background="radial-gradient(circle,#6cf,#7b61ff00)";

glow.style.pointerEvents="none";

glow.style.zIndex="999999";

glow.style.transition="all .7s ease";

document.body.appendChild(glow);

requestAnimationFrame(()=>{

glow.style.transform="scale(3)";
glow.style.opacity="0";

});

setTimeout(()=>{

glow.remove();

},700);

},{passive:true});

}

</script>
</body>
</html>
